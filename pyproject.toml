[project]
name = "code-retrieval"
version = "0.2.0"
description = "Language-server-guided cross-file code retrieval"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.13.0",
    "basedpyright>=1.40.2",
    "bm25s>=0.3.13",
    "datasets>=4.8.4",
    "evaluate>=0.4.6",
    "matplotlib>=3.11.2",
    "pandas>=3.0.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "sentence-transformers>=6.1.0",
    "thefuzz>=0.22.1",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
    "transformers>=5.4.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-c-sharp>=0.23.1",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
]

[project.scripts]
code-retrieval = "code_retrieval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code_retrieval", "retriever"]
